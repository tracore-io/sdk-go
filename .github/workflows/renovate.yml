name: Renovate

on:
  schedule:
    # Daily at 03:00 UTC. Renovate decides what to raise; renovate.json gates the rest.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options:
          - debug
          - info
          - warn
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

permissions:
  contents: read

# Never run two Renovate jobs against the repo at once.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.1
        with:
          # PAT or GitHub App token (NOT the default GITHUB_TOKEN) so Renovate PRs
          # trigger the PR checks and Renovate can update workflow files.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
